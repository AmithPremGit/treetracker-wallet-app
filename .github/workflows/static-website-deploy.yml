name: Deploy NextJS to AWS

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Select environment to deploy'
        required: true
        type: choice
        default: dev
        options:
          - dev
          - test
          - prod
      test_mode:
        description: 'Simulate deploy (skip real AWS calls)'
        required: false
        default: 'true'

env:
  project-directory: ./apps/web
  REPOSITORY: 'Greenstand/treetracker-wallet-app'

jobs:
  build:
    name: Build Next.js Static Site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install

      - name: Set environment variables
        run: |
          case "${{ github.event.inputs.environment }}" in
            dev)
              echo "NEXT_PUBLIC_HOSTNAME=https://d-dev.cloudfront.net" > ${{ env.project-directory }}/.env.local
              ;;
            test)
              echo "NEXT_PUBLIC_HOSTNAME=https://d-test.cloudfront.net" > ${{ env.project-directory }}/.env.local
              ;;
            prod)
              echo "NEXT_PUBLIC_HOSTNAME=https://d-prod.cloudfront.net" > ${{ env.project-directory }}/.env.local
              ;;
          esac

      - name: Build for deployment
        run: |
          cd ${{ env.project-directory }}
          yarn build

      - name: List output directory content
        run: |
          ls -la ${{ env.project-directory }}/out

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: static-site-build
          path: ${{ env.project-directory }}/out
          retention-days: 1

  deploy:
    name: Deploy to AWS (Simulated)
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: static-site-build
          path: build

      - name: List downloaded artifacts
        run: ls -la build/

      - name: Configure AWS credentials
        if: github.event.inputs.test_mode != 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Simulate or Run Deployment
        run: |
          case "${{ github.event.inputs.environment }}" in
            dev)
              BUCKET="${{ secrets.DEV_CDN_S3_BUCKET }}"
              DIST_ID="${{ secrets.DEV_CDN_DISTRIBUTION_ID }}"
              HOST="https://d-dev.cloudfront.net"
              ;;
            test)
              BUCKET="${{ secrets.TEST_CDN_S3_BUCKET }}"
              DIST_ID="${{ secrets.TEST_CDN_DISTRIBUTION_ID }}"
              HOST="https://d-test.cloudfront.net"
              ;;
            prod)
              BUCKET="${{ secrets.PROD_CDN_S3_BUCKET }}"
              DIST_ID="${{ secrets.PROD_CDN_DISTRIBUTION_ID }}"
              HOST="https://d-prod.cloudfront.net"
              ;;
          esac

          echo "Selected env: ${{ github.event.inputs.environment }}"
          echo "Test mode: ${{ github.event.inputs.test_mode }}"
          echo "BUCKET: $BUCKET"
          echo "DIST_ID: $DIST_ID"
          echo "HOST: $HOST"
          echo "Build contents:"
          ls -la build/

          if [[ "${{ github.event.inputs.test_mode }}" == "true" ]]; then
            echo "Test mode enabled — skipping real AWS calls."
            echo "::notice title=Simulation Complete::Would deploy to $HOST"
            exit 0
          fi

          echo "Deploying to AWS..."
          aws s3 sync build/ s3://$BUCKET/ --delete
          aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/*"
          echo "::notice title=Deployment Complete::Website deployed to $HOST"